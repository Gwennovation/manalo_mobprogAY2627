name: manalo_mobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
    - assets/images/
  # fonts are optional for this lab (Klavika/Frutiger are licensed fonts),
  # so the app falls back to the default Material font.
  uses-material-design: true
